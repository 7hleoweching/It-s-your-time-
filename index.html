<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAGAGEN OS | ARCHITECT C. WECHING KONYAK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500&family=Orbitron:wght@400;900&display=swap');
        body { background-color: #020617; color: #22d3ee; font-family: 'Fira Code', monospace; margin-bottom: 100px; overflow-x: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .hologram-card { background: rgba(0, 242, 255, 0.05); border: 1px solid rgba(34, 211, 238, 0.2); backdrop-filter: blur(10px); border-radius: 12px; }
        input, textarea { background: rgba(0, 0, 0, 0.8) !important; border: 1px solid #083344 !important; color: #22d3ee !important; outline: none; padding: 10px; border-radius: 4px; }
        .btn-cyan { background: #22d3ee; color: #020617; font-weight: bold; border-radius: 4px; transition: 0.3s; cursor: pointer; }
        .btn-cyan:hover { background: white; box-shadow: 0 0 15px #22d3ee; }
        #job-chat-box::-webkit-scrollbar { width: 5px; }
        #job-chat-box::-webkit-scrollbar-thumb { background: #083344; }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
        <div class="text-left">
            <h1 class="orbitron text-4xl font-black italic tracking-tighter uppercase">NAGA<span class="text-white">GEN</span> OS</h1>
            <p class="text-[10px] tracking-[0.4em] opacity-40 uppercase">Architect: C. Weching Konyak</p>
        </div>
        
        <div class="flex gap-4">
            <div class="hologram-card p-3 text-center min-w-[120px]">
                <div class="text-[9px] opacity-50 uppercase mb-1">Local Time</div>
                <div id="clock-local" class="orbitron text-xl font-bold">00:00:00</div>
            </div>
            <div class="hologram-card p-3 text-center min-w-[120px] border-cyan-500/50">
                <div class="text-[9px] opacity-50 uppercase mb-1">System Uptime</div>
                <div id="clock-utc" class="orbitron text-xl font-bold text-white">00:00:00</div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="space-y-6">
            <section class="hologram-card p-6 border-t-2 border-cyan-500">
                <h2 class="orbitron text-[11px] font-bold mb-4 text-cyan-400 uppercase">Offline_Career_Bot v1.0</h2>
                <div id="job-chat-box" class="h-64 overflow-y-auto mb-4 bg-black/40 p-4 border border-white/5 text-[12px] space-y-4 rounded">
                    <div class="text-white/60">AI: System ready. Ask about BCA prospects, salary, or future tech in Nagaland.</div>
                </div>
                <div class="flex gap-2">
                    <input id="job-in" type="text" class="flex-1 text-sm" placeholder="Type query...">
                    <button onclick="askJobAI()" class="btn-cyan px-6 text-xs uppercase">Ask</button>
                </div>
            </section>

            <section class="hologram-card p-6 border-l-2 border-amber-500">
                <h2 class="orbitron text-[11px] font-bold text-amber-500 mb-4 uppercase">Neural_Math_Module</h2>
                <div class="flex flex-col">
                    <input id="calc-display" type="text" class="w-full text-right text-2xl font-bold mb-2" placeholder="0" readonly>
                    <div class="grid grid-cols-4 gap-1">
                        <button onclick="addToCalc('7')" class="p-3 bg-white/5 hover:bg-white/10">7</button>
                        <button onclick="addToCalc('8')" class="p-3 bg-white/5 hover:bg-white/10">8</button>
                        <button onclick="addToCalc('9')" class="p-3 bg-white/5 hover:bg-white/10">9</button>
                        <button onclick="addToCalc('/')" class="p-3 bg-cyan-950 text-cyan-400">/</button>
                        <button onclick="addToCalc('4')" class="p-3 bg-white/5 hover:bg-white/10">4</button>
                        <button onclick="addToCalc('5')" class="p-3 bg-white/5 hover:bg-white/10">5</button>
                        <button onclick="addToCalc('6')" class="p-3 bg-white/5 hover:bg-white/10">6</button>
                        <button onclick="addToCalc('*')" class="p-3 bg-cyan-950 text-cyan-400">*</button>
                        <button onclick="addToCalc('1')" class="p-3 bg-white/5 hover:bg-white/10">1</button>
                        <button onclick="addToCalc('2')" class="p-3 bg-white/5 hover:bg-white/10">2</button>
                        <button onclick="addToCalc('3')" class="p-3 bg-white/5 hover:bg-white/10">3</button>
                        <button onclick="addToCalc('-')" class="p-3 bg-cyan-950 text-cyan-400">-</button>
                        <button onclick="clearCalc()" class="p-3 bg-red-900/20 text-red-400">C</button>
                        <button onclick="addToCalc('0')" class="p-3 bg-white/5 hover:bg-white/10">0</button>
                        <button onclick="runCalc()" class="p-3 btn-cyan">=</button>
                        <button onclick="addToCalc('+')" class="p-3 bg-cyan-950 text-cyan-400">+</button>
                    </div>
                </div>
            </section>
        </div>

        <div class="space-y-6">
            <section class="hologram-card p-6 border-r-2 border-cyan-500">
                <h2 class="orbitron text-[11px] font-bold text-cyan-400 mb-6 uppercase">Resume_Constructor_v2</h2>
                <div class="space-y-4">
                    <input id="cvName" type="text" class="w-full text-sm font-bold" value="C WECHING KONYAK">
                    <input id="cvEdu" type="text" class="w-full text-sm" value="BCA Candidate | NIELIT Kohima">
                    <textarea id="cvSkills" rows="3" class="w-full text-sm">Full-Stack Web Development, Gemini AI Integration, Material UI, Konyak Language Preservation Technology</textarea>
                    <textarea id="cvProjects" rows="3" class="w-full text-sm">NagaGen OS: Futuristic Web Terminal; Konyak Tutor: AI-based language learning app; Angun Crafts: Premium e-commerce platform.</textarea>
                    <button onclick="downloadCV()" class="w-full btn-cyan py-4 orbitron text-[11px] uppercase tracking-widest mt-4">Generate & Download PDF Resume</button>
                </div>
            </section>
        </div>
    </div>

    <script>
        // --- FIXED 1. CLOCK LOGIC ---
        function updateClocks() {
            const now = new Date();
            const local = document.getElementById('clock-local');
            const utc = document.getElementById('clock-utc');
            if(local) local.innerText = now.toLocaleTimeString();
            if(utc) utc.innerText = now.toISOString().substr(11, 8);
        }
        setInterval(updateClocks, 1000);
        updateClocks(); // Run once immediately

        // --- FIXED 2. JOB AI LOGIC ---
        function askJobAI() {
            const inputField = document.getElementById('job-in');
            const input = inputField.value.trim().toLowerCase();
            const box = document.getElementById('job-chat-box');
            if(!input) return;

            let response = "I'm analyzing that. For now, focus on BCA prospects in Nagaland and AI development.";
            if (input.includes("bca") || input.includes("job")) {
                response = "BCA graduates in 2026 are highly valued for Web Development and AI Prompt Engineering. In Nagaland, focus on Govt. Tech Services.";
            } else if (input.includes("salary")) {
                response = "Starting salaries for Junior Devs range from ₹3L to ₹6L per year. AI skills can increase this significantly.";
            }

            box.innerHTML += `<div class="text-right opacity-40 italic mt-2">> ${input}</div>`;
            box.innerHTML += `<div class="text-cyan-400 font-bold mt-1">AI: ${response}</div>`;
            inputField.value = "";
            box.scrollTop = box.scrollHeight;
        }

        // Enter key for Chat
        document.getElementById('job-in').addEventListener('keypress', (e) => { if(e.key === 'Enter') askJobAI(); });

        // --- 3. CALCULATOR LOGIC ---
        function addToCalc(v) { document.getElementById('calc-display').value += v; }
        function clearCalc() { document.getElementById('calc-display').value = ""; }
        function runCalc() { 
            try { document.getElementById('calc-display').value = eval(document.getElementById('calc-display').value); } 
            catch { document.getElementById('calc-display').value = "ERROR"; setTimeout(clearCalc, 1000); }
        }

        // --- 4. PDF GENERATION ---
        function downloadCV() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const name = document.getElementById('cvName').value;
            doc.setFillColor(2, 6, 23); doc.rect(0, 0, 210, 50, 'F');
            doc.setTextColor(34, 211, 238); doc.setFontSize(26); doc.text(name, 20, 30);
            doc.setTextColor(255, 255, 255); doc.setFontSize(12); doc.text("Software Developer & AI Specialist", 20, 40);
            doc.setTextColor(0); doc.setFontSize(16); doc.text("EDUCATION", 20, 70);
            doc.setFontSize(11); doc.text(document.getElementById('cvEdu').value, 20, 80);
            doc.save(`${name}_CV.pdf`);
        }
    </script>
</body>
</html>
